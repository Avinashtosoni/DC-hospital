server {
    # 80 is the primary port. 3000 is also served so the app works even if
    # Coolify's "Ports Exposes" is left at its default (3000).
    listen 80;
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 10m;

    # ── compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

    # ── security headers ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── health check (used by Docker HEALTHCHECK / Coolify) ──
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── runtime config: never cache ──
    location = /env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── PWA: service worker, manifest and build id must always be revalidated ──
    location ~ ^/(sw\.js|manifest\.webmanifest|version\.json)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Service-Worker-Allowed "/" always;
        types { application/javascript js; application/manifest+json webmanifest; application/json json; }
        try_files $uri =404;
    }

    # ── fingerprinted build assets: cache forever ──
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── Hospital Comrade control panel: a separate app with its own page (never cached, not indexed) ──
    location = /control-panel {
        absolute_redirect off;
        return 301 /control-panel/;
    }
    location /control-panel/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri /control-panel/index.html;
    }

    # ── SPA: every other route falls back to index.html (never cached) ──
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
