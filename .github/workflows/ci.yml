name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · SQL · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Master SQL is up to date
        run: |
          npm run sql:build
          git diff --exit-code -- supabase/master.sql supabase/production.sql \
            || (echo "::error::supabase/*.sql is stale — run 'npm run sql:build' and commit the result" && exit 1)

      - name: Tests (database in PGlite, notify providers, WhatsApp bot)
        run: npm test

      - name: Edge Functions (notify + whatsapp-bot in Deno, two hospitals)
        run: npm run test:edge

      - name: Production build
        run: npx vite build

      - name: Bundle budget (entry chunk, charts not preloaded)
        run: |
          entry=$(ls dist/assets/index-*.js | head -1)
          size=$(stat -c %s "$entry")
          echo "entry chunk: $entry — $size bytes"
          test "$size" -lt 600000 || (echo "::error::entry chunk grew beyond 600 KB" && exit 1)
          for f in $(grep -o '/assets/[^"]*\.js' dist/index.html); do
            if grep -q 'CartesianGrid' "dist$f"; then echo "::error::recharts is loaded on first paint via $f"; exit 1; fi
          done
          test -f dist/sw.js && ! grep -q '__BUILD_ID__' dist/sw.js || (echo "::error::service worker was not stamped" && exit 1)

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
