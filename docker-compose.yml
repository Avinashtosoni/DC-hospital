# Works with Coolify's "Docker Compose" build pack and plain `docker compose up -d`.
# Leave the Supabase variables empty to run in demo mode.
services:
  dc-hospital:
    build:
      context: .
      dockerfile: Dockerfile
    image: dc-hospital:latest
    restart: unless-stopped
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
      # set to true for real hospitals: refuse to start in demo (browser-only) mode if Supabase is missing
      - REQUIRE_BACKEND=${REQUIRE_BACKEND:-}
      # single = one hospital per install (default) · multi = Hospital Comrade SaaS: many hospitals, chosen by domain
      - TENANCY=${TENANCY:-single}
      # production | staging (staging shows a badge and never indexes in search engines)
      - APP_ENV=${APP_ENV:-production}
      - PLATFORM_NAME=${PLATFORM_NAME:-Hospital Comrade}
      - PLATFORM_DOMAIN=${PLATFORM_DOMAIN:-hospital.digitalcomrade.in}
      - PLATFORM_LEGAL_NAME=${PLATFORM_LEGAL_NAME:-}
      - PLATFORM_ADDRESS=${PLATFORM_ADDRESS:-}
      - PLATFORM_EMAIL=${PLATFORM_EMAIL:-}
      - PLATFORM_PHONE=${PLATFORM_PHONE:-}
      - PLATFORM_GRIEVANCE_OFFICER=${PLATFORM_GRIEVANCE_OFFICER:-}
      - PLATFORM_JURISDICTION=${PLATFORM_JURISDICTION:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - CSP_MODE=${CSP_MODE:-enforce}
      - HSTS=${HSTS:-on}
      - CSP_SCRIPT_EXTRA=${CSP_SCRIPT_EXTRA:-}
    # Coolify's proxy routes to container port 80 — no host port needed.
    # For local use without Coolify, uncomment:
    # ports:
    #   - "8080:80"
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
